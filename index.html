<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto01-Formulario</title>
</head>
<body>
    <main>
        <h1>Checkout</h1>
        <form>
            <label for="Payment">Payment Method</label>
                <select id="Payment" name="Payment">
                    <option>Visa Ending in 4566</option>
                    <option>American Express Ending in 9122</option>
                    <option>Discover Ending in 9865</option>
                </select>
                <br><br>

            <fieldset>
                <legend>Shipping Method</legend>
                <input type="radio" id="shop1" name="Shipping">
                    <label for="shop1">FREE - 2 Day Shipping</label><br>
                <input type="radio" id="shop2" name="Shipping">
                    <label for="shop2">Standard Shipping (4-5 Business Days)</label><br>
                <input type="radio" id="shop3" name="Shipping">
                    <label for="shop3">FREE - No Rush Shipping (5 Business Days)</label><br>
            </fieldset><br>

            <label for="giff">This is a gift</label>
            <input type="checkbox" id="giff" name="giff"><br>

            <button type="submit">Place Your Order</button>
        </form>
    </main>
</body>
</html>
